# svaraflow-asr/Cargo.toml
[package]
name = "svaraflow-asr"
description = "Speech-to-text (whisper.cpp bindings), model selection, Silero VAD and hybrid mode for SvaraFlow."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
# Inherited from [workspace.package]. None of the internal crates are
# published to crates.io; the shipped artifacts are the `svaraflow-cli`
# binary and the Tauri app. Setting this stops cargo-deny from treating
# the workspace-internal path deps as wildcard publishing targets.
publish.workspace = true

[features]
# `vad` pulls in ONNX Runtime through `ort`, for the Silero VAD used to
# chunk audio before transcription. Default on.
vad = ["dep:ort"]
# `cuda` builds whisper.cpp with CUDA and turns on the GPU code path at
# runtime. Off by default so the crate builds CPU-only on any machine.
cuda = ["whisper-rs/cuda"]
default = ["vad"]

[dependencies]
svaraflow-core.workspace = true
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# whisper.cpp bindings. `default-features = false` keeps GPU backends off
# unless the `cuda` feature above is enabled.
whisper-rs = { version = "0.16", default-features = false }

# Model downloader: HTTP with resume, plus SHA-256 verification.
#
# `rustls` is the correct feature name in ureq 3.x. It activates the
# rustls TLS backend with a default crypto provider. `default-features =
# false` drops ureq's own defaults (currently `rustls` + `gzip`); the
# downloader does not need decompression because model files are served
# raw, and enabling only what we use keeps the binary small.
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"
hex = "0.4"

# Silero VAD through ONNX Runtime, from the earlier workstream. Optional
# behind `vad`.
ort = { version = "2.0.0-rc.9", default-features = false, features = [
    "ndarray",
    "std",
    "load-dynamic",
], optional = true }