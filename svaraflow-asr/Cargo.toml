[package]
name = "svaraflow-asr"
description = "Speech-to-text (whisper.cpp bindings), model selection, Silero VAD and hybrid mode for SvaraFlow."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
# `vad` pulls in ONNX Runtime through `ort`, for the Silero VAD used to
# chunk audio before transcription. Default on.
vad = ["dep:ort"]
# `cuda` builds whisper.cpp with CUDA and turns on the GPU code path at
# runtime. Off by default so the crate builds CPU-only on any machine.
cuda = ["whisper-rs/cuda"]
default = ["vad"]

[dependencies]
svaraflow-core.workspace = true
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# whisper.cpp bindings. `default-features = false` keeps GPU backends off
# unless the `cuda` feature above is enabled.
whisper-rs = { version = "0.16", default-features = false }

# Model downloader: HTTP with resume, plus SHA-256 verification.
ureq = { version = "3", default-features = false, features = ["tls-rustls"] }
sha2 = "0.10"
hex = "0.4"

# Silero VAD through ONNX Runtime, from the earlier workstream. Optional
# behind `vad`.
ort = { version = "2.0.0-rc.9", default-features = false, features = [
    "ndarray",
    "std",
    "load-dynamic",
], optional = true }