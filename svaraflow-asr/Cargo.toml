[package]
name = "svaraflow-asr"
description = "Speech-to-text (whisper.cpp bindings), model selection, Silero VAD and hybrid mode for SvaraFlow."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
# `vad` pulls in ONNX Runtime through `ort`. Disable with
# `--no-default-features` on machines that only need the non-VAD parts of
# the crate.
default = ["vad"]
vad = ["dep:ort"]

[dependencies]
svaraflow-core.workspace = true
thiserror = "1"

# ONNX Runtime bindings for Silero VAD.
#
# `default-features = false` drops `download-binaries` and `tls-native`.
# The download path in `ort-sys` 2.0.0-rc.12+ requires a TLS backend and
# calls a `ureq` 3.x API surface that the resolved `ureq` does not expose;
# system linking avoids both problems and makes offline builds possible.
#
# Set `ORT_LIB_PATH` to the directory containing `onnxruntime.dll` (Windows)
# or `libonnxruntime.so` (Linux), or install ONNX Runtime system-wide and
# let `pkg-config` find it. See docs/DECISIONS.md (ADR-0018).
ort = { version = "2.0.0-rc.9", default-features = false, features = [
    "ndarray",
    "std",
    "load-dynamic",
], optional = true }