[package]
name = "svaraflow-cli"
description = "Command-line front end for SvaraFlow, reusing the core, asr, text and render crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
# `vad` forwards to `svaraflow-asr`'s `vad` feature. Default on, so
# `--method vad` and `--method hybrid` work out of the box.
default = ["vad"]
vad = ["svaraflow-asr/vad"]
# `cuda` forwards to `svaraflow-asr`'s `cuda` feature, which builds
# whisper.cpp with the CUDA backend. Requires the CUDA Toolkit on PATH and
# `CUDA_PATH` set. See docs/BUILD.md.
cuda = ["svaraflow-asr/cuda"]

[[bin]]
name = "svaraflow-cli"
path = "src/main.rs"

[[bin]]
name = "bench-asr"
path = "src/bin/bench_asr.rs"

[dependencies]
svaraflow-core.workspace = true
svaraflow-asr.workspace = true
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dunce = "1"