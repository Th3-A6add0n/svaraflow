[package]
name = "svaraflow-cli"
description = "Command-line front end for SvaraFlow."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["vad"]
vad = ["svaraflow-asr/vad"]

[[bin]]
name = "svaraflow-cli"
path = "src/main.rs"

[dependencies]
svaraflow-core.workspace = true
svaraflow-asr.workspace = true

anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows path canonicalization without the `\\?\` verbatim prefix.
dunce = "1"