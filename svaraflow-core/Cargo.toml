# svaraflow-core/Cargo.toml
[package]
name = "svaraflow-core"
description = "Audio I/O, silence detection, timeline model, cut engine and FCP7 XML export for SvaraFlow."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
# Inherited from [workspace.package]; see the note in svaraflow-asr's
# Cargo.toml.
publish.workspace = true

[dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Pure-Rust decoding. Pinned to 0.5 on purpose: symphonia 0.6 raises the MSRV
# to 1.85 (Rust 2024 edition), which would break the workspace's
# `rust-version = "1.75"`. See docs/DECISIONS.md (ADR-0011).
symphonia = { version = "0.5", features = [
    "aac",
    "alac",
    "flac",
    "isomp4",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }

# Sample-rate conversion for the 16 kHz analysis signal.
rubato = "0.16"

# XML writer for the FCP7 xmeml export.
#
# Bumped from 0.37 to pick up fixes for RUSTSEC-2026-0194 (quadratic
# duplicate-attribute check in Reader) and RUSTSEC-2026-0195 (unbounded
# namespace allocation in NsReader). Neither path is reachable from this
# crate — we only use quick-xml's `Writer`, never `Reader` or `NsReader` —
# but the fixed version costs nothing and lets `cargo deny check
# advisories` run with no ignore list.
quick-xml = "0.41"